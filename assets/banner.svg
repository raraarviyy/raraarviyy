<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Rara Arviana">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFD6E8"/>
<stop offset="0.5" stop-color="#E6D5F7"/>
<stop offset="1" stop-color="#CDE7FF"/>
</linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#C77DBA"/>
<stop offset="0.5" stop-color="#8E7CC3"/>
<stop offset="1" stop-color="#6FA8DC"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="round"><rect width="900" height="320" rx="28"/></clipPath>
<clipPath id="reveal">
<rect x="215" y="222" height="30" width="0">
<animate attributeName="width" values="0;470;470;0" keyTimes="0;0.5;0.85;1" dur="7s" repeatCount="indefinite"/>
</rect>
</clipPath>
<path id="spark" d="M0-14C2-5 5-2 14 0C5 2 2 5 0 14C-2 5-5 2-14 0C-5-2-2-5 0-14Z"/>
<path id="heart" d="M0 9C-16-3-9-16 0-6C9-16 16-3 0 9Z"/>
<g id="flower">
<circle cx="0" cy="-7" r="5"/>
<circle cx="7" cy="-2" r="5"/>
<circle cx="4" cy="6" r="5"/>
<circle cx="-4" cy="6" r="5"/>
<circle cx="-7" cy="-2" r="5"/>
<circle cx="0" cy="0" r="3.5" fill="#FFE8A3"/>
</g>
</defs>

<g clip-path="url(#round)">
<rect width="900" height="320" fill="url(#bg)"/>

<circle cx="140" cy="90" r="90" fill="#FFFFFF" opacity="0.55" filter="url(#blur)">
<animate attributeName="cx" values="140;220;140" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="760" cy="230" r="100" fill="#FFF3B0" opacity="0.5" filter="url(#blur)">
<animate attributeName="cy" values="230;170;230" dur="10s" repeatCount="indefinite"/>
</circle>
<circle cx="450" cy="310" r="90" fill="#FFC4DD" opacity="0.5" filter="url(#blur)"/>

<path d="M0 292Q150 262 300 292T600 292T900 292T1200 292T1500 292V320H0Z" fill="#FFFFFF" opacity="0.35">
<animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="12s" repeatCount="indefinite"/>
</path>
<path d="M0 304Q150 280 300 304T600 304T900 304T1200 304T1500 304V320H0Z" fill="#FFFFFF" opacity="0.3">
<animateTransform attributeName="transform" type="translate" values="-600 0;0 0" dur="9s" repeatCount="indefinite"/>
</path>

<g transform="translate(90,80)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-14;14;-14" dur="4.2s" repeatCount="indefinite"/><use href="#spark" fill="#FFFFFF"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(175,245)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="5s" repeatCount="indefinite"/><use href="#heart" fill="#FF9EC4" transform="scale(0.9)"><animate attributeName="opacity" values="1;0.5;1" dur="3.2s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(790,70)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="4.6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-16;16;-16" dur="4.6s" repeatCount="indefinite"/><use href="#spark" fill="#FFF3B0" transform="scale(1.2)"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(845,195)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5.4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="5.4s" repeatCount="indefinite"/><use href="#heart" fill="#FFB3D1"><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(715,262)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.8s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/><use href="#flower" fill="#FFFFFF"/></g></g></g>
<g transform="translate(55,190)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="16s" repeatCount="indefinite"/><use href="#flower" fill="#FFD1E3"/></g></g></g>
<g transform="translate(300,52)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.8s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-20;20;-20" dur="3.8s" repeatCount="indefinite"/><use href="#spark" fill="#FFFFFF" transform="scale(0.7)"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(610,44)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4.4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="4.4s" repeatCount="indefinite"/><use href="#heart" fill="#FFC4DD" transform="scale(0.75)"><animate attributeName="opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(470,276)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="-18;18;-18" dur="3.6s" repeatCount="indefinite"/><use href="#spark" fill="#FFFFFF" transform="scale(0.8)"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></use></g></g></g>
<g transform="translate(858,120)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5.6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/><use href="#flower" fill="#E3F1FF" transform="scale(0.8)"/></g></g></g>
<g transform="translate(240,150)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/><use href="#spark" fill="#FFE8A3" transform="scale(0.5)"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></use></g></g>
<g transform="translate(660,160)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.4s" repeatCount="indefinite"/><use href="#spark" fill="#FFE8A3" transform="scale(0.5)"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></use></g></g>

<text x="450" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#A58FC9">WELCOME TO MY SPACE</text>

<text x="450" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#ink)">
Rara Arviana
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" repeatCount="indefinite"/>
</text>

<rect x="430" y="174" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.9">
<animate attributeName="x" values="430;380;430" dur="4s" repeatCount="indefinite"/>
<animate attributeName="width" values="40;140;40" dur="4s" repeatCount="indefinite"/>
</rect>

<text x="450" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#7B6A9B">Software Engineering Student</text>

<g clip-path="url(#reveal)">
<text x="450" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9D84B7">Web &amp; Mobile Developer  /  Front-End Enthusiast</text>
</g>
</g>
</svg>