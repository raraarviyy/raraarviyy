<svg xmlns="http://www.w3.org/2000/svg" width="300" height="68" viewBox="0 0 300 68" role="img" aria-label="View My Portfolio">
<defs>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFC8DD"/>
<stop offset="0.5" stop-color="#E2CFF2"/>
<stop offset="1" stop-color="#BDE0FE"/>
</linearGradient>
<clipPath id="pill"><rect x="4" y="4" width="292" height="60" rx="30"/></clipPath>
<path id="spark" d="M0-14C2-5 5-2 14 0C5 2 2 5 0 14C-2 5-5 2-14 0C-5-2-2-5 0-14Z"/>
</defs>

<rect x="4" y="4" width="292" height="60" rx="30" fill="url(#btn)" stroke="#FFFFFF" stroke-width="3">
<animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
</rect>

<g clip-path="url(#pill)">
<rect x="-80" y="0" width="50" height="68" fill="#FFFFFF" opacity="0.55" transform="skewX(-20)">
<animate attributeName="x" values="-80;340" dur="3.2s" repeatCount="indefinite"/>
</rect>
</g>

<g transform="translate(34,34)">
<use href="#spark" fill="#FFFFFF" transform="scale(0.8)">
<animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
</use>
</g>

<text x="150" y="41" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B4B7A">View My Portfolio</text>

<g transform="translate(248,34)" fill="none" stroke="#5B4B7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.4s" repeatCount="indefinite"/>
<path d="M0 0H16M10-6L16 0L10 6"/>
</g>
</g>
</svg>